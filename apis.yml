name: Flock Safety
description: 'Flock Safety is a public safety technology company whose platform connects communities,
  businesses, and law enforcement through crime detection, investigation, and response tools built
  around license plate recognition (LPR) cameras, audio detection, video, and the FlockOS situational-awareness
  platform. Its v3 API Platform (api.flocksafety.com) lets approved customer organizations and third-party
  developers build "Flock Apps" that bring data in (register hardware as devices, ingest vehicle images
  for detection, push CAD events, alerts, and geolocation telemetry, manage custom hotlists) and connect
  Flock data out (retrieve devices, look up license plate reads, and subscribe to real-time LPR hotlist
  alert webhooks). The APIs use OAuth 2.0 with machine-level (client_credentials) and recommended user-level
  (authorization_code) flows, role-based access control, audit logging, and data-stewardship requirements.'
