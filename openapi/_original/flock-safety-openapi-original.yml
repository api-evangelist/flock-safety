  /devices/{deviceId}/images:
    post:
      summary: Uploading images of a vehicle.
      description: Uploads images of a vehicle that will be ingested and processed. The total size of
        the main vehicle image and all of the context images must not exceed 9 MB. File size is calculated
        in binary mb (MB), where 1 MB is 1048576 bytes.
      tags:
      - Vehicle Images
      parameters:
      - in: path
        name: deviceId
        schema:
          type: string
        required: true
        description: The ID of the device that this image was captured by.
      security:
      - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUpload'
            encoding:
              image:
                contentType: image/jpeg
              contextImages:
                contentType: image/jpeg
      responses:
        '204':
          description: The image was successfully ingested.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthorizationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          description: 'The total size of all the images uploaded exceeds 9 MiB. Total file sizes: 13
            MiB'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: max_image_size_exceeded
                  message: 'The total size of all the images uploaded exceeds 9 MiB. Total size: 13 MiB'
                  errors:
                  - field: image
                    message: 'The total size of all the images uploaded exceeds 9 MiB. Total size: 13
                      MiB'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'
