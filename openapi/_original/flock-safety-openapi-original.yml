    post:
      summary: Creating an Generic Alert
      description: Creates a new generic alert that will be displayed in FlockOS
      tags:
      - Alerts
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericAlert'
